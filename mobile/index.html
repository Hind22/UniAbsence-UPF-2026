<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>UniAbsence</title>
  </head>
  <body>
    <button
      type="button"
      id="preview-toggle"
      class="preview-toggle"
      aria-pressed="true"
      aria-label="Désactiver la prévisualisation iPhone"
    >
      Prévisualisation iPhone
    </button>
    <div class="device-stage">
      <div class="iphone-frame" role="region" aria-label="Prévisualisation iPhone 15">
        <span class="iphone-side-button iphone-action-button" aria-hidden="true"></span>
        <span class="iphone-side-button iphone-volume-up" aria-hidden="true"></span>
        <span class="iphone-side-button iphone-volume-down" aria-hidden="true"></span>
        <span class="iphone-side-button iphone-power-button" aria-hidden="true"></span>
        <div class="phone-screen">
          <div class="iphone-status-bar" aria-label="Barre d’état iPhone">
            <span id="preview-clock" class="iphone-status-time">9:41</span>
            <span class="dynamic-island" aria-hidden="true"></span>
            <span class="iphone-status-icons" aria-hidden="true">
              <svg viewBox="0 0 18 14" class="status-signal">
                <path d="M1 13V9.5h2.5V13M5 13V7h2.5v6M9 13V4.5h2.5V13M13 13V1h2.5v12" />
              </svg>
              <svg viewBox="0 0 18 14" class="status-wifi">
                <path d="M1.5 4.7a11 11 0 0 1 15 0M4.3 7.5a7 7 0 0 1 9.4 0M7 10.2a3.1 3.1 0 0 1 4 0M9 12.5h.01" />
              </svg>
              <svg viewBox="0 0 25 14" class="status-battery">
                <rect x="1" y="1.5" width="20" height="11" rx="3" />
                <path d="M23 5v4" />
                <rect x="3.2" y="3.7" width="15.5" height="6.6" rx="1.5" class="battery-level" />
              </svg>
            </span>
          </div>
          <div id="app"></div>
          <div class="iphone-home-indicator" aria-hidden="true">
            <span></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
